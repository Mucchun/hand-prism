<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand Prism</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  video { display: none; }
  #msg {
    position: fixed; left: 0; right: 0; bottom: 28px; text-align: center;
    font: 500 14px/1.4 -apple-system, "Helvetica Neue", sans-serif;
    color: rgba(255,255,255,.75); letter-spacing: .02em; pointer-events: none;
    transition: opacity .6s;
  }
  #msg.hide { opacity: 0; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="out"></canvas>
<div id="msg">Loading hand tracker…</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "./vendor/vision_bundle.mjs";

const video = document.getElementById("cam");
const canvas = document.getElementById("out");
const ctx = canvas.getContext("2d");
const msg = document.getElementById("msg");
const params = new URLSearchParams(location.search);
const srcFile = params.get("src");          // ?src=clip.mp4 runs on a video file instead of the camera
const mirror = !srcFile;                    // selfie view for the live camera

// Low-res buffer the colour effect is computed in (upscaled into the quad).
const fx = document.createElement("canvas");
const fxCtx = fx.getContext("2d", { willReadFrequently: true });
const FX_MAX = 1440;                       // effect is computed near screen resolution so grain is pixel-fine

// Palette: colour bands along the luminance ramp. Every band's hue, saturation
// and lightness runs on its own fast clock, so the whole sheet never stops
// morphing — each region slides through colours independently of its neighbours.
const NB = 14;
const POS = Array.from({ length: NB + 1 }, (_, i) => i / NB);
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const BANDS = POS.map((_, i) => ({
  h0: (i * 0.381966 + 0.07) % 1,
  hs: (i % 2 ? -1 : 1) * (0.00012 + 0.00030 * rnd(i, 1)),      // full hue lap every ~2.5-8 s
  ha: 0.0011 + 0.0016 * rnd(i, 2), hp: rnd(i, 3) * 6.28,       // plus a wobble so it isn't a plain rainbow roll
  ss: 0.0017 + 0.0021 * rnd(i, 4), sp: rnd(i, 5) * 6.28,
  ls: 0.0021 + 0.0027 * rnd(i, 6), lp: rnd(i, 7) * 6.28,
}));
const LUT = new Uint8ClampedArray(256 * 3);
function hsl(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12; return 255 * (l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };
  return [f(0), f(8), f(4)];
}
function buildLUT(t) {
  const cols = BANDS.map(b => hsl(
    (((b.h0 + t * b.hs + 0.16 * Math.sin(t * b.ha + b.hp)) % 1) + 1) % 1,
    0.74 + 0.24 * Math.sin(t * b.ss + b.sp),
    0.52 + 0.24 * Math.sin(t * b.ls + b.lp)));
  cols[NB] = cols[0];                              // wrap seamlessly
  for (let i = 0; i < 256; i++) {
    const f = i / 256 * NB, k = Math.floor(f);
    let u = Math.min(1, (f - k) / 0.55); u = u * u * (3 - 2 * u);   // soft blend, then a flat band
    for (let c = 0; c < 3; c++) LUT[i * 3 + c] = cols[k][c] + (cols[k + 1][c] - cols[k][c]) * u;
  }
}
// Brightness curve: spreads the bright end (face, hands) over more bands than the dark end.
const CURVE = new Float32Array(256);
for (let i = 0; i < 256; i++) CURVE[i] = Math.pow(i / 255, 1.5) * 255 * 1.2;
const soft = document.createElement("canvas");     // small copy -> smooth, thermal-style contours
const softCtx = soft.getContext("2d");
const NOISE = new Int8Array(65536);
for (let i = 0; i < NOISE.length; i++) NOISE[i] = (Math.random() - 0.5) * (Math.random() < 0.14 ? 30 : 8);
let lo = 0, hi = 255;

const BONES = [
  [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16], [13,17],[17,18],[18,19],[19,20], [0,17],
];

let landmarker;
let smooth = [];            // smoothed hands, each an array of 21 {x,y} in canvas pixels
let lastVideoTime = -1;
let lastHands = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  fx.width = Math.min(canvas.width, FX_MAX);
  fx.height = Math.max(2, Math.round(fx.width * canvas.height / canvas.width));
}
addEventListener("resize", resize);
resize();

// Draw the video "cover"-fitted (and mirrored for the camera) into any context.
function drawVideo(c, w, h) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(w / vw, h / vh);
  const dw = vw * s, dh = vh * s;
  c.save();
  if (mirror) { c.translate(w, 0); c.scale(-1, 1); }
  c.drawImage(video, (w - dw) / 2, (h - dh) / 2, dw, dh);
  c.restore();
}

// Normalised landmark -> canvas pixel, matching drawVideo's transform.
function toCanvas(p) {
  const w = canvas.width, h = canvas.height;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(w / vw, h / vh);
  let x = (w - vw * s) / 2 + p.x * vw * s;
  const y = (h - vh * s) / 2 + p.y * vh * s;
  if (mirror) x = w - x;
  return { x, y };
}

function updateHands(raw) {
  // Order hands left-to-right on screen so smoothing slots stay stable.
  const hands = raw.map(h => h.map(toCanvas)).sort((a, b) => a[0].x - b[0].x);
  if (hands.length !== smooth.length) { smooth = hands; return; }
  const k = 0.55;
  hands.forEach((h, i) => h.forEach((p, j) => {
    const q = smooth[i][j];
    q.x += (p.x - q.x) * k;
    q.y += (p.y - q.y) * k;
  }));
}

// Recolour the camera image. Only the rectangle around the prism (x0,y0,x1,y1 in
// canvas pixels) is processed, which keeps full-resolution grain cheap.
function renderEffect(t, x0, y0, x1, y1) {
  const w = fx.width, h = fx.height, k = w / canvas.width;
  soft.width = 256; soft.height = Math.max(2, Math.round(256 * h / w));
  drawVideo(softCtx, soft.width, soft.height);
  buildLUT(t);

  // Auto-levels from the small copy so even a dim room spans the whole palette.
  const sd = softCtx.getImageData(0, 0, soft.width, soft.height).data, sn = sd.length / 4;
  const hist = new Uint32Array(256);
  for (let i = 0; i < sd.length; i += 4) hist[(sd[i] * 77 + sd[i + 1] * 150 + sd[i + 2] * 29) >> 8]++;
  let acc = 0, pLo = 0, pHi = 255;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > sn * 0.02) { pLo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > sn * 0.02) { pHi = i; break; } }
  lo += (pLo - lo) * 0.08; hi += (Math.max(pHi, pLo + 24) - hi) * 0.08;
  const gain = 255 / (hi - lo);

  const bx = Math.max(0, Math.floor(x0 * k) - 2), by = Math.max(0, Math.floor(y0 * k) - 2);
  const bw = Math.min(w, Math.ceil(x1 * k) + 2) - bx, bh = Math.min(h, Math.ceil(y1 * k) + 2) - by;
  if (bw < 1 || bh < 1) return;
  fxCtx.imageSmoothingQuality = "high";
  fxCtx.drawImage(soft, 0, 0, w, h);               // upscaled soft copy -> smooth, thermal-style contours
  const img = fxCtx.getImageData(bx, by, bw, bh);
  const d = img.data;
  const shift = t * 0.035 + Math.sin(t * 0.0017) * 14;   // bands keep sliding through the image
  let seed = (Math.random() * 65536) | 0;
  for (let o = 0; o < d.length; o += 4) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    let l = (((d[o] * 77 + d[o + 1] * 150 + d[o + 2] * 29) >> 8) - lo) * gain;
    l = l < 0 ? 0 : l > 255 ? 255 : l | 0;
    const idx = ((CURVE[l] + shift + NOISE[(seed >> 8) & 65535]) & 255) * 3;
    d[o] = LUT[idx]; d[o + 1] = LUT[idx + 1]; d[o + 2] = LUT[idx + 2];
  }
  fxCtx.putImageData(img, bx, by);
}

function drawSkeleton(hand) {
  const u = canvas.width / 1000;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#ff1f1f";
  ctx.lineWidth = 4.5 * u;
  ctx.beginPath();
  for (const [a, b] of BONES) { ctx.moveTo(hand[a].x, hand[a].y); ctx.lineTo(hand[b].x, hand[b].y); }
  ctx.stroke();
  ctx.fillStyle = "#1dff2a";
  for (const p of hand) { ctx.beginPath(); ctx.arc(p.x, p.y, 6 * u, 0, Math.PI * 2); ctx.fill(); }
}

function frame(t) {
  requestAnimationFrame(frame);
  if (!video.videoWidth) return;
  const w = canvas.width, h = canvas.height;

  if (landmarker && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    lastHands = landmarker.detectForVideo(video, t).landmarks || [];
    updateHands(lastHands);
  }

  // Dimmed, slightly warm camera feed behind everything.
  drawVideo(ctx, w, h);
  ctx.fillStyle = "rgba(20, 0, 8, 0.38)";
  ctx.fillRect(0, 0, w, h);

  if (params.has("full")) {                     // debug: effect over the whole frame
    const t0 = performance.now(); renderEffect(t, 0, 0, w, h); window.__fxms = performance.now() - t0;
    ctx.drawImage(fx, 0, 0, w, h);
  } else if (smooth.length >= 2) {
    const [a, b] = smooth;
    // Corners: index tip + thumb tip of each hand. If turning a hand would make
    // the top and bottom edges cross (a bow-tie), swap that hand's two corners so
    // the sheet always stays one open, unfolded panel.
    const side = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
    const cross = (p, q, r, s) => side(p, q, r) * side(p, q, s) < 0 && side(r, s, p) * side(r, s, q) < 0;
    const quad = cross(a[8], b[8], b[4], a[4]) ? [a[8], b[4], b[8], a[4]] : [a[8], b[8], b[4], a[4]];
    const xs = quad.map(p => p.x), ys = quad.map(p => p.y);
    renderEffect(t, Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    ctx.save();
    ctx.beginPath();
    quad.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(fx, 0, 0, w, h);
    ctx.restore();
    // Hairline so the sheet still reads as a rainbow thread when pinched flat.
    const g = ctx.createLinearGradient(quad[0].x, quad[0].y, quad[1].x, quad[1].y);
    for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsl(${(i * 60 + t * 0.2) % 360} 100% 55%)`);
    ctx.strokeStyle = g;
    ctx.lineWidth = 2 * w / 1000;
    ctx.beginPath();
    quad.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();
  }

  smooth.forEach(drawSkeleton);
  window.__hands = smooth.length;               // test hook
}

async function start() {
  try {
    const files = await FilesetResolver.forVisionTasks("./vendor/wasm");
    const make = delegate => HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: "./vendor/hand_landmarker.task", delegate },
      runningMode: "VIDEO", numHands: 2,
      minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    if (params.has("cpu")) landmarker = await make("CPU");
    else try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }

    if (srcFile) {
      video.src = srcFile; video.loop = true;
    } else {
      msg.textContent = "Allow camera access…";
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
      });
    }
    await video.play();
    msg.textContent = "Hold up both hands — thumbs and index fingers stretch the prism";
    setTimeout(() => msg.classList.add("hide"), 6000);
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    msg.textContent = e.name === "NotAllowedError"
      ? "Camera access was blocked — allow it in the address bar and reload."
      : "Couldn't start: " + e.message;
  }
}
start();
</script>
</body>
</html>
